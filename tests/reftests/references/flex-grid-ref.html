<!doctype html>
<title>Independent absolute rectangles, no flex or grid</title>
<style>
html { margin: 0; padding: 0; }
body { margin: 0; position: relative; }
div { position: absolute; }
.a { left: 0; top: 0; width: 55px; height: 40px; background: green; }
.b { left: 65px; top: 0; width: 55px; height: 40px; background: blue; }
.c { left: 0; top: 50px; width: 40px; height: 20px; background: green; }
.d { left: 50px; top: 50px; width: 80px; height: 20px; background: blue; }
.e { left: 0; top: 80px; width: 40px; height: 20px; background: red; }
.f { left: 50px; top: 80px; width: 80px; height: 20px; background: orange; }
</style>
<div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div><div class="f"></div>
