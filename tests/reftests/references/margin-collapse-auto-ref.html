<!doctype html>
<title>Two independently positioned centered rectangles</title>
<style>
html { margin: 0; padding: 0; }
body { margin: 0; position: relative; }
div { position: absolute; left: 50%; margin-left: -80px; width: 160px; height: 20px; }
.first { top: 0; background: green; }
.second { top: 50px; background: blue; }
</style>
<div class="first"></div><div class="second"></div>
