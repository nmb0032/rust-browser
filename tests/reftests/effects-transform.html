<!doctype html>
<link rel="match" href="references/effects-transform-ref.html">
<style>
html,body{margin:0}
div{position:absolute}
#turn{left:50px;top:50px;width:30px;height:20px;background:red;transform:rotate(90deg);transform-origin:0 0}
#plane{left:100px;top:50px;width:20px;height:10px;background:blue;transform:perspective(100px) translateZ(50px);transform-origin:left top}
#corner{left:0;top:0;width:5px;height:5px;background:red}
#order{left:180px;top:50px;width:10px;height:10px;background:green;translate:20px;rotate:90deg;scale:2;transform:translateX(5px);transform-origin:0 0}
</style>
<div id="turn"></div>
<div id="plane"><div id="corner"></div></div>
<div id="order"></div>
