name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Windowing build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests and html5lib baseline (remaining conformance failures informational)
        run: cargo test --lib --tests -- --show-output
