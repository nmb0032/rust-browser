[package]
name = "rust-browser"
version = "0.1.0"
edition = "2024"

[features]
# Opt-in full-style reference paths for the existing styling benchmark.
style-bench-reference = []

[dependencies]
ureq = "3"
url = "2"
clap = { version = "4", features = ["derive"] }
winit = "0.30.13"
softbuffer = "0.4.8"
fontdue = "0.9.4"
fontdb = "0.23"
rustybuzz = "0.20"
wuff = { version = "0.2.9", default-features = false }
brotli-decompressor = "5"
flate2 = "1"
base64 = "0.22"
unicode-segmentation = "1.12"
unicode-script = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
percent-encoding = "2"
encoding_rs = "0.8"
xml-rs = "0.8"
unicode-linebreak = "0.1.5"
unicode-bidi = "0.3.18"
unicode-vo = "0.1.0"
swash = "0.2"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
unicode-normalization = "0.1"
svgtypes = "0.15"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
png = "0.18"
moxcms = "0.8"

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "styling"
harness = false

[[bench]]
name = "images"
harness = false

[[bench]]
name = "frame"
harness = false
